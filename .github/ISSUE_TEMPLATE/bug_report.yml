name: Bug report
description: Report something that does not work as documented.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please search existing issues first.
        Do not use this form for security vulnerabilities. Follow the security policy instead: https://github.com/Iridium-Group/.github/blob/main/SECURITY.md
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear, short description of the bug.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Node.js version (`node -v`), npm version (`npm -v`), and browser if relevant.
      placeholder: |
        OS: Ubuntu 24.04
        Node.js: 22.18.0
        npm: 10.9.3
        Browser: Firefox 145
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The project version or commit you are using.
      placeholder: 0.1.0
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Exact steps that reproduce the problem. A minimal example is most helpful.
      placeholder: |
        1. Install with ...
        2. Run ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log output. Remove tokens, cookies, and other private data before pasting.
      render: shell
  - type: textarea
    id: additional
    attributes:
      label: Additional information
      description: Anything else that might help, such as screenshots or related issues.
